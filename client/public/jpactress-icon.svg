<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="jpactress-icon-title">
  <title id="jpactress-icon-title">JPactress icon</title>
  <defs>
    <linearGradient id="icon-mark-gradient" x1="28" x2="93" y1="143" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b00045"/>
      <stop offset=".55" stop-color="#ff1f67"/>
      <stop offset="1" stop-color="#ff3f86"/>
    </linearGradient>
    <linearGradient id="icon-p-gradient" x1="88" x2="151" y1="44" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".65" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <filter id="icon-glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#ff2a70" flood-opacity=".95"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feGaussianBlur stdDeviation="12"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="180" height="180" rx="36" fill="#111"/>
  <g filter="url(#icon-glow)" opacity=".4">
    <ellipse cx="88" cy="102" rx="70" ry="38" fill="#ff2a70"/>
  </g>
  <g filter="url(#icon-shadow)">
    <path fill="url(#icon-mark-gradient)" stroke="#7b0832" stroke-width="1.5" d="M55 31h41c-4 48-12 77-25 94-14 18-35 29-66 33l-6-32c20-4 33-11 41-22 8-12 12-36 15-73Z"/>
